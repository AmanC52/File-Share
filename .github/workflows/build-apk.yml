name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: cp app/build/outputs/apk/debug/app-debug.apk FileShareMobile.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FileShare-Mobile-APK
        path: FileShareMobile.apk

    - name: Publish Direct GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1
        name: "FileShare v2.1 (Sleek Modern Start Hub & UI Overhaul)"
        body: |
          # 🚀 FileShare v2.1 Official Release

          ### 📥 Direct One-Click Download:
          - 📱 **[Download FileShareMobile.apk](https://github.com/AmanC52/File-Share/releases/download/v2.1/FileShareMobile.apk)**
          
          ### ✨ What's New in v2.1:
          - 🎨 **Modern Start Hub Redesign**: Replaced the plain button with a sleek glowing interactive Power Dial with radar halo wave animations.
          - 📱 **Clean UI & Glassmorphism ("Safai se UI")**: Modern card styling, crisp white QR code container, quick Action buttons (Copy, Open Web, Native Share).
          - 📶 **Live Network Status Bar**: Real-time Wi-Fi status, Local IP, and offline feature guides.
          - 🚀 **Brand Icon**: Official glowing rocket & speed-wave branding embedded in header and app launcher.
        files: FileShareMobile.apk
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
