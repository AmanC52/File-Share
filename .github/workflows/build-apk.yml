name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Release
      run: cp app/build/outputs/apk/debug/app-debug.apk FileShareMobile.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FileShare-Mobile-APK
        path: FileShareMobile.apk

    - name: Publish Direct GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0
        name: "FileShare v2.0 (Mobile APK & Windows App)"
        body: |
          # 🚀 FileShare v2.0 Release

          ### 📥 Direct One-Click Download:
          - 📱 **[Download FileShareMobile.apk](https://github.com/AmanC52/File-Share/releases/download/v2.0/FileShareMobile.apk)**
          
          ### ✨ Features & Fixes:
          - 🎨 **New Brand Icon**: Custom glowing rocket & speed-wave app icon across all Android densities.
          - 🔲 **Real QR Code Engine**: ZXing integration for instant connection QR code on laptop browser.
          - 📤 **High-Speed File Uploads**: Streaming multipart upload parser directly into phone storage.
          - ⚡ **Zero-Lag UI**: In-memory caching for lightning fast file browsing.
        files: FileShareMobile.apk
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
